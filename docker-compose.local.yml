# Local development — starts only db and cache.
# Run the NestJS server directly: cd server && npm run start:dev

services:
  db:
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: acog
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - acog_local_db:/var/lib/postgresql/data

  cache:
    ports:
      - "6379:6379"

  pgadmin:
    image: dpage/pgadmin4
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@local.dev
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      - db

  redisinsight:
    image: redis/redisinsight:latest
    ports:
      - "5540:5540"
    depends_on:
      - cache

  # Disable services not needed locally
  app:
    profiles: ["disabled"]
  worker:
    profiles: ["disabled"]
  proxy:
    profiles: ["disabled"]

volumes:
  acog_local_db:
