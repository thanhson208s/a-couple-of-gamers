# acog-staging VPS: all services on a single host.

services:
  app:
    env_file: .env.staging
    networks:
      - acog_net

  worker:
    env_file: .env.staging
    networks:
      - acog_net

  db:
    environment:
      POSTGRES_DB: acog
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - acog_staging_db:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:15432:5432"
    networks:
      - acog_net

  cache:
    volumes:
      - acog_staging_cache:/data
    ports:
      - "127.0.0.1:16379:6379"
    networks:
      - acog_net

  proxy:
    volumes:
      - ./Caddyfile.staging:/etc/caddy/Caddyfile:ro
      - /etc/caddy/certs:/etc/caddy/certs:ro
      - caddy_staging_data:/data
      - caddy_staging_config:/config
    ports:
      - "80:80"
      - "443:443"
    networks:
      - acog_net

  admin:
    env_file: .env.staging
    environment:
      - API_URL=http://app:3000
    networks:
      - acog_net

volumes:
  acog_staging_db:
  acog_staging_cache:
  caddy_staging_data:
  caddy_staging_config:
