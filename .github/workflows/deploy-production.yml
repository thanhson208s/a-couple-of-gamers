name: Deploy to Production

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Image tag to deploy — version tag (e.g. v1.2.3) or SHA"
        required: true
        type: string

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/server

jobs:
  deploy:
    name: Deploy to production
    runs-on: [self-hosted, production]
    environment: production
    steps:
      - name: Log in to GHCR
        run: echo "${{ secrets.REGISTRY_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Pull image
        run: docker pull ${{ env.IMAGE }}:${{ inputs.image_tag }}

      - name: Pull latest repo changes
        run: git -C /opt/acog pull

      - name: Run migrations
        run: |
          docker run --rm \
            --env-file /opt/acog/.env.production \
            ${{ env.IMAGE }}:${{ inputs.image_tag }} \
            node dist/app.js --run-migrations

      - name: Deploy
        run: |
          cd /opt/acog
          SERVER_IMAGE=${{ env.IMAGE }} IMAGE_TAG=${{ inputs.image_tag }} \
            docker compose -f docker-compose.yml -f docker-compose.prod-app.yml up -d
          curl -f http://localhost:3000/health
