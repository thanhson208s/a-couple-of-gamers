name: Deploy to Production

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Image tag to deploy — version tag (e.g. v1.2.3) or SHA"
        required: true
        type: string

env:
  SERVER_IMAGE: ghcr.io/${{ github.repository_owner }}/server
  ADMIN_IMAGE: ghcr.io/${{ github.repository_owner }}/admin

jobs:
  deploy:
    name: Deploy to production
    runs-on: [self-hosted, production]
    environment: production
    steps:
      - name: Log in to GHCR
        run: echo "${{ secrets.REGISTRY_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Pull server image
        run: docker pull ${{ env.SERVER_IMAGE }}:${{ inputs.image_tag }}

      - name: Pull admin image
        run: docker pull ${{ env.ADMIN_IMAGE }}:${{ inputs.image_tag }}

      - name: Pull latest repo changes
        run: git -C /opt/acog pull

      - name: Pre-deploy backup
        run: |
          cd /opt/acog
          CURRENT_TAG=$(docker inspect acog-app-1 \
            --format '{{.Config.Image}}' 2>/dev/null \
            | awk -F: '{print $NF}' || echo "initial")
          ./scripts/backup.sh --env=production --mode=predeploy --tag="${CURRENT_TAG:-initial}"

      - name: Run migrations
        run: |
          cd /opt/acog

          export ENV_FILE=.env.production
          export SERVER_IMAGE=${{ env.SERVER_IMAGE }}
          export ADMIN_IMAGE=${{ env.ADMIN_IMAGE }}
          export IMAGE_TAG=${{ inputs.image_tag }}

          docker compose --env-file .env.production \
            -f docker-compose.yml \
            -f docker-compose.prod-app.yml \
            run --rm --no-deps app \
            node ../node_modules/typeorm/cli.js migration:run -d dist/app.data.js

      - name: Deploy
        run: |
          cd /opt/acog

          export ENV_FILE=.env.production
          export SERVER_IMAGE=${{ env.SERVER_IMAGE }}
          export ADMIN_IMAGE=${{ env.ADMIN_IMAGE }}
          export IMAGE_TAG=${{ inputs.image_tag }}

          docker compose --env-file .env.production \
            -f docker-compose.yml \
            -f docker-compose.prod-app.yml \
            up -d app worker admin

          for i in $(seq 1 30); do
            if docker compose --env-file .env.production \
              -f docker-compose.yml \
              -f docker-compose.prod-app.yml \
              exec -T app wget -qO- http://localhost:3000/health; then
              echo "Health check passed"
              exit 0
            fi

            echo "Waiting for app health... attempt $i/30"
            sleep 2
          done

          echo "Health check failed. App logs:"
          docker compose --env-file .env.production \
            -f docker-compose.yml \
            -f docker-compose.prod-app.yml \
            logs --tail=120 app
          exit 1
      
      - name: Cleanup local Docker images
        if: success()
        run: |
          docker image prune -f
