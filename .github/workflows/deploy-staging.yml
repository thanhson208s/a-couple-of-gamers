name: Deploy to Staging

on:
  push:
    branches:
      - main
    tags:
      - "v*"
    # Note: paths filters are ignored for tag pushes, so v* release builds always run.
    # Only main pushes are filtered (e.g. docs-only commits no longer auto-deploy).
    paths:
      - 'server/**'
      - 'admin/**'
      - 'package.json'
      - 'package-lock.json'
      - 'docker-compose.yml'
      - 'docker-compose.staging.yml'
      - 'Caddyfile.staging'
      - 'scripts/**'
      - '.github/workflows/deploy-staging.yml'

env:
  SERVER_IMAGE: ghcr.io/${{ github.repository_owner }}/server
  ADMIN_IMAGE: ghcr.io/${{ github.repository_owner }}/admin

jobs:
  build:
    name: Build and push Docker image
    runs-on: [self-hosted, staging]
    permissions:
      contents: read
      packages: write
    outputs:
      image_tag: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Build server image
        run: docker build -f server/Dockerfile -t ${{ env.SERVER_IMAGE }}:${{ github.sha }} .

      - name: Push server SHA tag
        run: docker push ${{ env.SERVER_IMAGE }}:${{ github.sha }}

      - name: Push server version tag
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          docker tag ${{ env.SERVER_IMAGE }}:${{ github.sha }} ${{ env.SERVER_IMAGE }}:${{ github.ref_name }}
          docker push ${{ env.SERVER_IMAGE }}:${{ github.ref_name }}

      - name: Build admin image
        run: docker build -f admin/Dockerfile -t ${{ env.ADMIN_IMAGE }}:${{ github.sha }} .

      - name: Push admin SHA tag
        run: docker push ${{ env.ADMIN_IMAGE }}:${{ github.sha }}

      - name: Push admin version tag
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          docker tag ${{ env.ADMIN_IMAGE }}:${{ github.sha }} ${{ env.ADMIN_IMAGE }}:${{ github.ref_name }}
          docker push ${{ env.ADMIN_IMAGE }}:${{ github.ref_name }}

      - name: Print build image tags
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            BUILD_TAG="${{ github.ref_name }}"
            TAG_TYPE="version tag"
          else
            BUILD_TAG="${{ github.sha }}"
            TAG_TYPE="SHA tag"
          fi

          echo "Build completed successfully"
          echo "Tag type: ${TAG_TYPE}"
          echo "Image tag: ${BUILD_TAG}"
          echo "Server image: ${{ env.SERVER_IMAGE }}:${BUILD_TAG}"
          echo "Admin image: ${{ env.ADMIN_IMAGE }}:${BUILD_TAG}"

          {
            echo "## Build completed successfully"
            echo ""
            echo "- Tag type: ${TAG_TYPE}"
            echo "- Image tag: \`${BUILD_TAG}\`"
            echo "- Server image: \`${{ env.SERVER_IMAGE }}:${BUILD_TAG}\`"
            echo "- Admin image: \`${{ env.ADMIN_IMAGE }}:${BUILD_TAG}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Notify Telegram
        if: always() && startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG_MESSAGE="$(git for-each-ref "refs/tags/${GITHUB_REF_NAME}" --format='%(contents:subject)' | head -n 1)"
          if [ -z "$TAG_MESSAGE" ]; then
            TAG_MESSAGE="No tag message provided"
          fi

          printf -v MESSAGE 'Build %s\nTag: %s\nMessage: %s' \
            "${{ job.status }}" \
            "${GITHUB_REF_NAME}" \
            "${TAG_MESSAGE}"

          curl -fs -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            --data-urlencode "chat_id=${{ secrets.TELEGRAM_CHAT_ID }}" \
            --data-urlencode "message_thread_id=35" \
            --data-urlencode "text=${MESSAGE}" >/dev/null 2>&1 || true

  deploy-staging:
    name: Deploy to staging
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: [self-hosted, staging]
    steps:
      - name: Log in to GHCR
        run: echo "${{ secrets.REGISTRY_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Pull server image
        run: docker pull ${{ env.SERVER_IMAGE }}:${{ needs.build.outputs.image_tag }}

      - name: Pull admin image
        run: docker pull ${{ env.ADMIN_IMAGE }}:${{ needs.build.outputs.image_tag }}

      - name: Deploy
        run: |
          cd /opt/acog
          git pull

          export ENV_FILE=.env.staging
          export SERVER_IMAGE=${{ env.SERVER_IMAGE }}
          export ADMIN_IMAGE=${{ env.ADMIN_IMAGE }}
          export IMAGE_TAG=${{ needs.build.outputs.image_tag }}
          
          docker compose --env-file .env.staging -f docker-compose.yml -f docker-compose.staging.yml up -d db cache

          CURRENT_TAG=$(docker inspect acog-app-1 \
            --format '{{.Config.Image}}' 2>/dev/null \
            | awk -F: '{print $NF}' || echo "initial")
          ./scripts/backup.sh --env=staging --mode=predeploy --tag="${CURRENT_TAG:-initial}"

          docker compose --env-file .env.staging -f docker-compose.yml -f docker-compose.staging.yml run --rm --no-deps app \
            node ../node_modules/typeorm/cli.js migration:run -d dist/app.data.js

          docker compose --env-file .env.staging -f docker-compose.yml -f docker-compose.staging.yml up -d app worker admin

          for i in $(seq 1 30); do
            if docker compose --env-file .env.staging -f docker-compose.yml -f docker-compose.staging.yml exec -T app \
              wget -qO- http://localhost:3000/health; then
              echo "Health check passed"
              exit 0
            fi

            echo "Waiting for app health... attempt $i/30"
            sleep 2
          done

          echo "Health check failed. App logs:"
          docker compose --env-file .env.staging -f docker-compose.yml -f docker-compose.staging.yml logs --tail=120 app
          exit 1

      - name: Cleanup local Docker cache
        if: always()
        run: |
          docker image prune -f
          docker builder prune -f --filter "until=24h"
