name: Deploy to Staging

on:
  push:
    branches:
      - dev
    tags:
      - "v*"

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/server

jobs:
  build:
    name: Build and push Docker image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image_tag: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Build and push SHA tag
        uses: docker/build-push-action@v6
        with:
          context: .
          file: server/Dockerfile
          platforms: linux/arm64
          push: true
          tags: ${{ env.IMAGE }}:${{ github.sha }}

      - name: Build and push version tag
        if: startsWith(github.ref, 'refs/tags/')
        uses: docker/build-push-action@v6
        with:
          context: .
          file: server/Dockerfile
          platforms: linux/arm64
          push: true
          tags: ${{ env.IMAGE }}:${{ github.ref_name }}

  deploy-staging:
    name: Deploy to staging
    needs: build
    if: github.ref == 'refs/heads/dev'
    runs-on: [self-hosted, staging]
    steps:
      - name: Log in to GHCR
        run: echo "${{ secrets.REGISTRY_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Pull image
        run: docker pull ${{ env.IMAGE }}:${{ needs.build.outputs.image_tag }}

      - name: Deploy
        run: |
          cd /opt/acog
          git pull

          export ENV_FILE=.env.staging
          export SERVER_IMAGE=${{ env.IMAGE }}
          export IMAGE_TAG=${{ needs.build.outputs.image_tag }}
          
          docker compose -f docker-compose.yml -f docker-compose.staging.yml up -d
          docker compose -f docker-compose.yml -f docker-compose.staging.yml exec -T app node dist/app.js --run-migrations
          curl -f http://localhost:3000/health
