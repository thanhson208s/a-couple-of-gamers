name: Deploy to Staging

on:
  push:
    branches:
      - dev
    tags:
      - "v*"

env:
  SERVER_IMAGE: ghcr.io/${{ github.repository_owner }}/server
  ADMIN_IMAGE: ghcr.io/${{ github.repository_owner }}/admin

jobs:
  build:
    name: Build and push Docker image
    runs-on: [self-hosted, staging]
    permissions:
      contents: read
      packages: write
    outputs:
      image_tag: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Build server image
        run: docker build -f server/Dockerfile -t ${{ env.SERVER_IMAGE }}:${{ github.sha }} .

      - name: Push server SHA tag
        run: docker push ${{ env.SERVER_IMAGE }}:${{ github.sha }}

      - name: Push server version tag
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          docker tag ${{ env.SERVER_IMAGE }}:${{ github.sha }} ${{ env.SERVER_IMAGE }}:${{ github.ref_name }}
          docker push ${{ env.SERVER_IMAGE }}:${{ github.ref_name }}

      - name: Build admin image
        run: docker build -f admin/Dockerfile -t ${{ env.ADMIN_IMAGE }}:${{ github.sha }} .

      - name: Push admin SHA tag
        run: docker push ${{ env.ADMIN_IMAGE }}:${{ github.sha }}

      - name: Push admin version tag
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          docker tag ${{ env.ADMIN_IMAGE }}:${{ github.sha }} ${{ env.ADMIN_IMAGE }}:${{ github.ref_name }}
          docker push ${{ env.ADMIN_IMAGE }}:${{ github.ref_name }}

  deploy-staging:
    name: Deploy to staging
    needs: build
    if: github.ref == 'refs/heads/dev'
    runs-on: [self-hosted, staging]
    steps:
      - name: Log in to GHCR
        run: echo "${{ secrets.REGISTRY_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Pull server image
        run: docker pull ${{ env.SERVER_IMAGE }}:${{ needs.build.outputs.image_tag }}

      - name: Pull admin image
        run: docker pull ${{ env.ADMIN_IMAGE }}:${{ needs.build.outputs.image_tag }}

      - name: Deploy
        run: |
          cd /opt/acog
          git pull

          export ENV_FILE=.env.staging
          export SERVER_IMAGE=${{ env.SERVER_IMAGE }}
          export ADMIN_IMAGE=${{ env.ADMIN_IMAGE }}
          export IMAGE_TAG=${{ needs.build.outputs.image_tag }}
          
          docker compose --env-file .env.staging -f docker-compose.yml -f docker-compose.staging.yml up -d db cache
          
          docker compose --env-file .env.staging -f docker-compose.yml -f docker-compose.staging.yml run --rm --no-deps app \
            node ../node_modules/typeorm/cli.js migration:run -d dist/app.data.js
          
          docker compose --env-file .env.staging -f docker-compose.yml -f docker-compose.staging.yml up -d
          docker compose --env-file .env.staging -f docker-compose.yml -f docker-compose.staging.yml restart proxy
          
          for i in $(seq 1 30); do
            if docker compose --env-file .env.staging -f docker-compose.yml -f docker-compose.staging.yml exec -T app \
              wget -qO- http://localhost:3000/health; then
              echo "Health check passed"
              exit 0
            fi

            echo "Waiting for app health... attempt $i/30"
            sleep 2
          done

          echo "Health check failed. App logs:"
          docker compose --env-file .env.staging -f docker-compose.yml -f docker-compose.staging.yml logs --tail=120 app
          exit 1

      - name: Cleanup local Docker cache
        if: always()
        run: |
          docker image prune -f
          docker builder prune -f --filter "until=24h"
