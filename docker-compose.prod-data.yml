# prod-data VPS: PostgreSQL and Redis.
# No public port exposure — accessed by prod-app over Oracle private network.

services:
  db:
    environment:
      POSTGRES_DB: acog
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - acog_prod_db:/var/lib/postgresql/data
    ports:
      - "10.0.1.14:5432:5432"
    networks:
      - acog_net
    restart: unless-stopped

  cache:
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}"]
    volumes:
      - acog_prod_cache:/data
    ports:
      - "10.0.1.14:6379:6379"
    networks:
      - acog_net
    restart: unless-stopped

  # Disable app-side services
  app:
    profiles: ["disabled"]
  worker:
    profiles: ["disabled"]
  proxy:
    profiles: ["disabled"]

volumes:
  acog_prod_db:
  acog_prod_cache:
