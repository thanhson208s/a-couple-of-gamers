services:
  app:
    image: ${SERVER_IMAGE:-ghcr.io/acog/server}:${IMAGE_TAG:-latest}
    environment:
      - NODE_ENV=production
    env_file: .env.production
    networks:
      - acog_net
    restart: unless-stopped

  worker:
    image: ${SERVER_IMAGE:-ghcr.io/acog/server}:${IMAGE_TAG:-latest}
    command: node dist/worker.js
    environment:
      - NODE_ENV=production
    env_file: .env.production
    networks:
      - acog_net
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: acog
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    networks:
      - acog_net
    restart: unless-stopped

  cache:
    image: redis:7-alpine
    networks:
      - acog_net
    restart: unless-stopped

  proxy:
    image: caddy:2-alpine
    networks:
      - acog_net
    restart: unless-stopped

networks:
  acog_net:
    driver: bridge
