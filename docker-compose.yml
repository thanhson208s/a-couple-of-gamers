services:
  app:
    image: ${SERVER_IMAGE:-ghcr.io/acog/server}:${IMAGE_TAG:-latest}
    environment:
      - NODE_ENV=production
    env_file:
      - ${ENV_FILE:-.env.local}
    networks:
      - acog_net
    restart: unless-stopped
    stop_grace_period: 15s

  worker:
    image: ${SERVER_IMAGE:-ghcr.io/acog/server}:${IMAGE_TAG:-latest}
    command: node dist/worker.js
    environment:
      - NODE_ENV=production
    env_file:
      - ${ENV_FILE:-.env.local}
    networks:
      - acog_net
    restart: unless-stopped
    stop_grace_period: 15s

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: acog
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    networks:
      - acog_net
    restart: unless-stopped

  cache:
    image: redis:7-alpine
    networks:
      - acog_net
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}"]

  proxy:
    image: caddy:2-alpine
    networks:
      - acog_net
    restart: unless-stopped

  admin:
    image: ${ADMIN_IMAGE:-ghcr.io/acog/admin}:${IMAGE_TAG:-latest}
    networks:
      - acog_net
    restart: unless-stopped

networks:
  acog_net:
    driver: bridge
